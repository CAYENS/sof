<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Neon Lab Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="mesh-bg" aria-hidden="true"></div>
    <header class="hero" id="home">
      <nav class="nav container">
        <a class="logo" href="#home">NEON.LAB</a>
        <div class="nav-controls">
          <select id="langSelect" class="lang-select" aria-label="Language selector">
            <option value="ru">RU</option>
            <option value="en">EN</option>
            <option value="zh">中文</option>
          </select>
          <button class="nav-toggle" id="navToggle" aria-label="Open menu">☰</button>
        </div>
        <ul class="nav-links" id="navLinks">
          <li><a href="#about" data-i18n="navAbout"></a></li>
          <li><a href="#projects" data-i18n="navProjects"></a></li>
          <li><a href="#playground" data-i18n="navPlayground"></a></li>
          <li><a href="#contacts" data-i18n="navContacts"></a></li>
          <li><a href="#reviews" data-i18n="navReviews"></a></li>
        </ul>
      </nav>

      <div class="hero-content container">
        <p class="hero-badge" data-i18n="heroBadge"></p>
        <h1 id="typingTitle" class="hero-title"></h1>
        <p class="hero-subtitle" data-i18n="heroSubtitle"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#projects" data-i18n="ctaProjects"></a>
          <a class="btn btn-secondary" href="#playground" data-i18n="ctaPlayground"></a>
        </div>
      </div>
    </header>

    <main>
      <section id="about" class="section container reveal">
        <h2 data-i18n="aboutTitle"></h2>
        <p data-i18n="aboutText"></p>
        <div class="about-grid">
          <article class="card hover-lift"><h3 data-i18n="aboutStack"></h3><p>React, Next.js, Node.js, TS, CSS-in-JS, WebGL.</p></article>
          <article class="card hover-lift"><h3 data-i18n="aboutFocus"></h3><p>Animation systems, performance, DX, scalable UI architecture.</p></article>
          <article class="card hover-lift"><h3 data-i18n="aboutMode"></h3><p>Design + code, product-thinking, clean commits, clear docs.</p></article>
        </div>
      </section>

      <section id="projects" class="section container reveal">
        <div class="section-head">
          <h2 data-i18n="projectsTitle"></h2>
          <p data-i18n="projectsHint"></p>
        </div>
        <div id="projectsGrid" class="projects-grid"></div>
      </section>

      <section id="playground" class="section container reveal">
        <div class="section-head">
          <h2 data-i18n="playTitle"></h2>
          <p data-i18n="playSubtitle"></p>
        </div>
        <div class="playground card">
          <div class="editor-panel">
            <div class="editor-header">HTML / CSS / JS</div>
            <textarea id="codeInput" spellcheck="false"></textarea>
            <button class="btn btn-primary" id="runCodeBtn" data-i18n="runCode"></button>
          </div>
          <div class="preview-panel">
            <div class="editor-header" data-i18n="preview"></div>
            <iframe id="codePreview" title="Live Preview"></iframe>
          </div>
        </div>
      </section>

      <section id="contacts" class="section container reveal">
        <h2 data-i18n="contactsTitle"></h2>
        <p data-i18n="contactsSubtitle"></p>
        <form id="contactForm" class="card form" novalidate>
          <label><span data-i18n="formName"></span><input type="text" name="name" required /></label>
          <label><span data-i18n="formEmail"></span><input type="email" name="email" required /></label>
          <label><span data-i18n="formMessage"></span><textarea name="message" rows="4" required></textarea></label>
          <button class="btn btn-primary" type="submit" data-i18n="send"></button>
          <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section id="reviews" class="section container reveal">
        <div class="section-head"><h2 data-i18n="reviewsTitle"></h2><p data-i18n="reviewsHint"></p></div>
        <div id="reviewsList" class="reviews-list"></div>
      </section>
    </main>

    <template id="projectTemplate">
      <article class="project-card hover-lift">
        <img class="project-image" alt="" loading="lazy" />
        <div class="project-content">
          <h3></h3><p class="project-description"></p><div class="project-tags"></div>
          <a class="btn btn-secondary project-link" target="_blank" rel="noopener noreferrer">Open</a>
        </div>
      </article>
    </template>

    <template id="reviewTemplate">
      <article class="review-card hover-lift">
        <p class="review-text"></p>
        <div class="review-meta"><strong class="review-author"></strong><span class="review-role"></span></div>
      </article>
    </template>

    <script src="script.js" defer></script>
  </body>
</html>
